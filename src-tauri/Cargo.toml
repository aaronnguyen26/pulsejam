[package]
name = "pulsejam-desktop"
version = "0.1.0"
description = "PulseJam AI — Standalone Desktop App"
authors = ["PulseJam AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = { version = "3", features = ["termination"] }
